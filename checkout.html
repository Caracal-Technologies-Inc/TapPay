<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pay by Tap Checkout</title><style>body{font:18px system-ui;max-width:420px;margin:60px auto;padding:24px;text-align:center}a{display:block;background:#087345;color:white;padding:18px;border-radius:12px;text-decoration:none}small{color:#555}</style><h1>Pay by Tap™</h1><h2 id="merchant">Checkout</h2><h1 id="amount"></h1><p id="status" role="status">Loading session…</p><a id="pay" hidden>Open Android demo</a><p><small>Simulation only. No money will be charged. The current Android lab still uses a fixed $1 demo.</small></p><script>
const id=new URLSearchParams(location.search).get('id');
const status=document.getElementById('status'),pay=document.getElementById('pay');
pay.style.display='none';
async function load(){try{const r=await fetch('/api/checkout/session?id='+encodeURIComponent(id||''),{cache:'no-store'});const s=await r.json();if(!r.ok)throw Error(s.error||'Checkout unavailable');document.getElementById('merchant').textContent=s.merchant||'Merchant';document.getElementById('amount').textContent=new Intl.NumberFormat('en-CA',{style:'currency',currency:s.currency}).format(s.amount_minor/100)+' '+s.currency;status.textContent=s.status==='created'?'Ready for simulation':s.status;const ready=s.status==='created'&&Date.now()<Date.parse(s.expires_at)&&s.amount_minor===100&&s.currency==='CAD';pay.hidden=!ready;pay.style.display=ready?'block':'none';if(ready)pay.href='intent://checkout?id='+encodeURIComponent(s.id)+'#Intent;scheme=tappay;package=com.caracal.tappay_nfc_lab;end';}catch(e){status.textContent=e.message;pay.hidden=true;pay.style.display='none';}}
load();setInterval(load,10000);
</script></html>
