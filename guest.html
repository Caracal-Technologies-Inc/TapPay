<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pay by Tap — Guest NFC Lab</title><style>body{font:18px system-ui;background:#101513;color:white;max-width:420px;margin:60px auto;padding:24px;text-align:center}button{font:inherit;padding:16px;border:0;border-radius:12px;margin:8px;background:#fff;color:#111}#status{padding:24px;background:#25332d;border-radius:12px;white-space:pre-wrap}small{color:#b9c7bf}</style><h1>Pay by Tap™</h1><p>Guest checkout · NFC Lab</p><h2>$1.00 CAD</h2><small>Diagnostic only. No payment or card data collection.</small><p id="status" role="status"></p><button id="start">Start NFC scan</button><button id="stop" disabled>Stop</button><p><small>Keep this page visible and the phone unlocked. Try a contactless card, then an NDEF tag if available.</small></p><script>const status=document.getElementById('status'),start=document.getElementById('start'),stop=document.getElementById('stop');let controller,reader,timer;const supported='NDEFReader' in window;status.textContent='Secure context: '+isSecureContext+'\nWeb NFC API: '+(supported?'available':'unavailable');start.disabled=!supported||!isSecureContext;function finish(message){clearTimeout(timer);controller?.abort();controller=null;reader=null;status.textContent=message;start.disabled=!supported||!isSecureContext;stop.disabled=true}start.onclick=async()=>{controller=new AbortController();const active=controller;start.disabled=true;stop.disabled=false;status.textContent='Requesting NFC access…';try{reader=new NDEFReader();reader.onreading=()=>{if(controller===active)finish('NDEF tag detected.\nNo payment processed.')};reader.onreadingerror=()=>{if(controller===active)status.textContent='NFC read error reported.\nTag may not support NDEF.\nTry another tag.'};await reader.scan({signal:active.signal});if(controller!==active)return;status.textContent='Scan active. Tap your card or NDEF tag.';timer=setTimeout(()=>{if(controller===active)finish('No readable NDEF tag detected within 30 seconds.\nThis does not rule out physical NFC hardware.')},30000)}catch(e){if(controller===active)finish('Scan failed: '+e.name+'\n'+e.message)}};stop.onclick=()=>finish('Scan stopped.');window.addEventListener('pagehide',()=>{if(controller)finish('Scan stopped.')});</script></html>
