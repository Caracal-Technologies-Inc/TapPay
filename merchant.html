<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pay by Tap Merchant</title><style>body{font:16px system-ui;max-width:420px;margin:60px auto;padding:20px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:6px 0}button{cursor:pointer}pre{white-space:pre-wrap}</style><h1>Pay by Tap™</h1><h2>Merchant account</h2><form id="form"><input id="email" type="email" placeholder="Email" required autocomplete="email"><input id="password" type="password" placeholder="Password (at least 12 characters)" minlength="12" required autocomplete="current-password"><button name="mode" value="login">Sign in</button><button name="mode" value="signup">Create account</button></form><p id="status" role="status"></p><script>const base='https://rwrclmvpftnompawvzhx.supabase.co/auth/v1/';const key='sb_publishable_-C9Szu2ccZkqEPGWOeDJyQ_aPaFIHDj';document.getElementById('form').onsubmit=async e=>{e.preventDefault();const mode=e.submitter.value;const status=document.getElementById('status');status.textContent='Please wait…';try{const r=await fetch(base+(mode==='signup'?'signup':'token?grant_type=password'),{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok){status.textContent=d.msg||d.message||'Authentication failed';return;}status.textContent=d.access_token?'Account authenticated. Merchant connection is not enabled yet.':'Check your email to confirm your account, then sign in.';}catch{status.textContent='Connection failed. Try again.'}finally{document.getElementById('password').value='';}};</script></html>
