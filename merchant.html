<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pay by Tap Merchant</title><style>body{font:16px system-ui;max-width:420px;margin:60px auto;padding:20px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:6px 0}button{cursor:pointer}pre{white-space:pre-wrap}</style><h1>Pay by Tap™</h1><h2>Merchant account</h2><form id="form"><input id="email" type="email" placeholder="Email" required autocomplete="email"><input id="password" type="password" placeholder="Password (at least 12 characters)" minlength="12" required autocomplete="current-password"><button name="mode" value="login">Sign in</button><button name="mode" value="signup">Create account</button></form><p id="status" role="status"></p><script>const base='https://rwrclmvpftnompawvzhx.supabase.co/auth/v1/';const key='sb_publishable_-C9Szu2ccZkqEPGWOeDJyQ_aPaFIHDj';document.getElementById('form').onsubmit=async e=>{e.preventDefault();const mode=e.submitter.value;const status=document.getElementById('status');status.textContent='Please wait…';try{const r=await fetch(base+(mode==='signup'?'signup':'token?grant_type=password'),{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok){status.textContent=d.msg||d.message||'Authentication failed';return;}if(d.access_token){status.textContent='Account authenticated.';const b=document.createElement('button');b.textContent='Connect Square';b.onclick=async()=>{b.disabled=true;try{const q=await fetch('/api/square/start',{method:'POST',headers:{Authorization:'Bearer '+d.access_token}});if(!q.ok)throw Error();const j=await q.json();location.assign(j.url);}catch{status.textContent='Connection could not start. Sign in again.';b.disabled=false;}};const panel=document.createElement('div');const v=document.createElement('button');v.textContent='Verify Square connection';const output=document.createElement('pre');v.onclick=async()=>{v.disabled=true;try{const r=await fetch('/api/square/locations',{headers:{Authorization:'Bearer '+d.access_token}});const j=await r.json();output.textContent=r.ok?JSON.stringify(j,null,2):(j.error||'Verification failed');}catch{output.textContent='Verification failed';}finally{v.disabled=false;}};const create=document.createElement('button');create.textContent='Create $1 CAD demo checkout';create.onclick=async()=>{create.disabled=true;try{const m=await fetch('https://rwrclmvpftnompawvzhx.supabase.co/rest/v1/merchants?select=id,name',{headers:{apikey:key,Authorization:'Bearer '+d.access_token}});if(!m.ok)throw Error();const merchants=await m.json();if(merchants.length!==1){output.textContent='Exactly one merchant account required for this demo.';return;}const q=await fetch('/api/checkout/session',{method:'POST',headers:{Authorization:'Bearer '+d.access_token,'Content-Type':'application/json'},body:JSON.stringify({merchant_id:merchants[0].id,amount_minor:100,currency:'CAD'})});const j=await q.json();output.textContent=JSON.stringify(j,null,2);if(q.ok){const a=document.createElement('a');a.href='/checkout.html?id='+encodeURIComponent(j.id);a.textContent='View checkout session';output.append(document.createElement('br'),a);}}catch{output.textContent='Checkout creation failed';}finally{create.disabled=false;}};panel.append(v,b,create,output);document.getElementById('form').replaceWith(panel);}else status.textContent='Check your email to confirm your account, then sign in.';}catch{status.textContent='Connection failed. Try again.'}finally{document.getElementById('password').value='';}};</script></html>
